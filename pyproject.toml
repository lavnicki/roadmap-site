[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadmap-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[project.scripts]
roadmap = "roadmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roadmap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
